name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: conventions & translations (changed files)
    runs-on: ubuntu-slim

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # Full history so the base commit of a PR is available to diff against
          fetch-depth: 0

      - name: Collect changed files
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git diff --name-only --diff-filter=d "$base...HEAD" > changed.txt
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            # A new branch (all-zero before) or a force-push leaves nothing to
            # diff against, so fall back to the pushed commit, then to the tree
            if [[ "$before" =~ ^0+$ ]] || ! git merge-base --is-ancestor "$before" "$after" 2>/dev/null; then
              if git rev-parse --verify -q "$after^" >/dev/null; then
                git diff --name-only --diff-filter=d "$after^" "$after" > changed.txt
              else
                git ls-files > changed.txt
              fi
            else
              git diff --name-only --diff-filter=d "$before" "$after" > changed.txt
            fi
          fi

          echo "Changed files:"
          sed 's/^/  /' changed.txt

      - name: Lint changed files
        run: |
          set -uo pipefail

          mapfile -t qml_files < <(grep -E '\.qml$' changed.txt || true)
          mapfile -t trs_files < <(grep -E '\.(qml|cpp|hpp)$' changed.txt || true)
          status=0

          if (( ${#trs_files[@]} )); then
            echo "::group::Translation issues (scripts/trs-check.py)"
            for f in "${trs_files[@]}"; do
              [[ -f "$f" ]] || continue
              echo "== $f"
              python3 scripts/trs-check.py --file "$f" || status=1
            done
            echo "::endgroup::"
          else
            echo "No changed .qml/.cpp/.hpp files to check for translation issues."
          fi

          if (( ${#qml_files[@]} )); then
            echo "::group::Convention violations (scripts/qml-lint-ratchet.py)"
            # Checks the changed files against scripts/qml-lint-baseline.json:
            # the violations already recorded there are allowed, anything beyond
            # them fails, so the backlog does not keep every PR red
            existing=()
            for f in "${qml_files[@]}"; do
              [[ -f "$f" ]] && existing+=("$f")
            done

            if (( ${#existing[@]} )); then
              for f in "${existing[@]}"; do
                echo "== $f"
              done
              python3 scripts/qml-lint-ratchet.py "${existing[@]}" || status=1
            else
              echo "No changed .qml files left on disk."
            fi
            echo "::endgroup::"
          else
            echo "No changed .qml files to check for convention violations."
          fi

          if (( status )); then
            echo "::error::Lint failed - see the reports above."
          fi
          exit "$status"

  qml-syntax:
    name: QML syntax (qmllint)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check every QML file parses
        run: |
          set -uo pipefail

          # qt6-declarative installs the analyzer as /usr/lib/qt6/bin/qmllint.
          # A plain "qmllint" on PATH is Qt 5's syntax verifier, which rejects
          # plenty of QML that Qt 6 accepts, so only use it as a last resort.
          qmllint=""
          for candidate in qmllint6 /usr/lib/qt6/bin/qmllint qmllint; do
            if command -v "$candidate" >/dev/null 2>&1; then
              qmllint="$candidate"
              break
            fi
          done

          if [[ -z "$qmllint" ]]; then
            echo "::error::No qmllint found. Is qt6-declarative installed in the CI image?"
            exit 1
          fi
          echo "Using $($qmllint --version)"

          # NOT git ls-files: the build image is not guaranteed to carry git
          mapfile -t files < <(find . \
            -path ./.git -prune -o \
            -path ./build -prune -o \
            -type f \( -name '*.qml' -o -name '*.js' \) -print | sort)

          status=0
          failed=0
          for f in "${files[@]}"; do
            if ! out=$("$qmllint" "$f" 2>&1); then
              failed=$((failed + 1))
              echo "::group::$f"
              printf '%s\n' "$out"
              echo "::endgroup::"
            fi
          done

          # Warnings do not fail (qmllint's default max-warnings is -1) - this
          # job is about QML that does not parse, which nothing else checks
          echo "Checked ${#files[@]} file(s), $failed with syntax errors"

          if (( failed )); then
            status=1
            echo "::error::$failed file(s) failed to parse - see the groups above."
          fi
          exit "$status"
